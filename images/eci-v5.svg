<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Lexical residuality and hard-negative transfer</title>
  <desc id="desc">Mean lexical residuality increases in the same source order as aggregate transfer in all six backbone and setting blocks.</desc>
  <rect width="720" height="440" rx="18" fill="#f8fafc"/>
  <text x="32" y="42" fill="#0f172a" font-family="Arial, sans-serif" font-size="23" font-weight="700">What tracks hard-negative transfer?</text>
  <text x="32" y="70" fill="#475569" font-family="Arial, sans-serif" font-size="14">Mean lexical residuality by negative source</text>
  <rect x="548" y="24" width="140" height="50" rx="12" fill="#e0e7ff"/>
  <text x="618" y="45" text-anchor="middle" fill="#3730a3" font-family="Arial, sans-serif" font-size="13" font-weight="700">ORDER AGREEMENT</text>
  <text x="618" y="64" text-anchor="middle" fill="#3730a3" font-family="Arial, sans-serif" font-size="16" font-weight="700">6 / 6 blocks</text>
  <rect x="24" y="96" width="328" height="286" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="368" y="96" width="328" height="286" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="128" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Individual sources</text>
  <text x="388" y="128" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Hybrid sources</text>
  <text x="44" y="151" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Lower</text>
  <text x="330" y="151" text-anchor="end" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Higher residuality</text>
  <text x="388" y="151" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Lower</text>
  <text x="674" y="151" text-anchor="end" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Higher residuality</text>
  <text x="44" y="190" fill="#334155" font-family="Arial, sans-serif" font-size="14">BM25</text>
  <rect x="126" y="174" width="69" height="22" rx="6" fill="#94a3b8"/>
  <text x="204" y="190" fill="#334155" font-family="Arial, sans-serif" font-size="13">0.288</text>
  <text x="44" y="238" fill="#334155" font-family="Arial, sans-serif" font-size="14">Dense</text>
  <rect x="126" y="222" width="93" height="22" rx="6" fill="#64748b"/>
  <text x="228" y="238" fill="#334155" font-family="Arial, sans-serif" font-size="13">0.387</text>
  <text x="44" y="286" fill="#334155" font-family="Arial, sans-serif" font-size="14">LLM</text>
  <rect x="126" y="270" width="128" height="22" rx="6" fill="#4f46e5"/>
  <text x="263" y="286" fill="#334155" font-family="Arial, sans-serif" font-size="13">0.531</text>
  <path d="M140 316h140" stroke="#cbd5e1" stroke-width="2"/>
  <text x="210" y="342" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="12">Transfer order: BM25 &lt; Dense &lt; LLM</text>
  <text x="388" y="190" fill="#334155" font-family="Arial, sans-serif" font-size="14">BM25 + Dense</text>
  <rect x="498" y="174" width="81" height="22" rx="6" fill="#94a3b8"/>
  <text x="588" y="190" fill="#334155" font-family="Arial, sans-serif" font-size="13">0.338</text>
  <text x="388" y="238" fill="#334155" font-family="Arial, sans-serif" font-size="14">BM25 + LLM</text>
  <rect x="498" y="222" width="99" height="22" rx="6" fill="#64748b"/>
  <text x="606" y="238" fill="#334155" font-family="Arial, sans-serif" font-size="13">0.410</text>
  <text x="388" y="286" fill="#334155" font-family="Arial, sans-serif" font-size="14">Dense + LLM</text>
  <rect x="498" y="270" width="111" height="22" rx="6" fill="#4f46e5"/>
  <text x="618" y="286" fill="#334155" font-family="Arial, sans-serif" font-size="13">0.461</text>
  <path d="M486 316h140" stroke="#cbd5e1" stroke-width="2"/>
  <text x="556" y="342" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="12">Transfer order: BM25 + Dense &lt; BM25 + LLM &lt; Dense + LLM</text>
  <text x="360" y="414" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13">The same source rankings were observed across DistilBERT, E5-base, and Contriever.</text>
</svg>
